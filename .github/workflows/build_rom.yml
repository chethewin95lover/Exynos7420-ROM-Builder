name: Build Custom ROM for Exynos 7420

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Clean Up Server Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo apt-get clean

    - name: Install Android Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib \
        gcc-multilib git gnupg gperf lib32ncurses5-dev lib32z1-dev libgl1-mesa-dev \
        libxml2-utils xsltproc zip zlib1g-dev openjdk-11-jdk repo

    - name: Initialize LineageOS Source & Local Manifest
      run: |
        mkdir -p ~/rom
        cd ~/rom
        repo init -u https://github.com/LineageOS/android.git -b lineage-21.0 --git-lfs
        
        mkdir -p .repo/local_manifests
        echo '<?xml version="1.0" encoding="UTF-8"?>
        <manifest>
          <project path="device/samsung/zenlte" name="Haldexx/device_samsung_zenlte" remote="github" />
        </manifest>' > .repo/local_manifests/zenlte.xml

    - name: Sync Source Code
      run: |
        cd ~/rom
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

    - name: Build the ROM
      run: |
        cd ~/rom
        source build/envsetup.sh
        lunch lineage_zenlte-userdebug
        mka bacon -j$(nproc --all)

    - name: Upload Finished ROM Zip
      uses: actions/upload-artifact@v4
      with:
        name: LineageOS-S6EdgePlus
        path: ~/rom/out/target/product/zenlte/*.zip
